services:
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_USER: leedbox
      POSTGRES_PASSWORD: leedbox_local
      POSTGRES_DB: leedbox_development
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_development:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leedbox -d leedbox_development"]
      interval: 5s
      timeout: 3s
      retries: 20
  postgres-test:
    image: postgres:17.6
    profiles: [test]
    environment:
      POSTGRES_USER: leedbox
      POSTGRES_PASSWORD: leedbox_local
      POSTGRES_DB: leedbox_test
    ports:
      - "127.0.0.1:5434:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leedbox -d leedbox_test"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  postgres_development:
