{% extends 'legal/base.html' %}{% block content %}<h1>{{ title }}</h1>{% if docs %}<nav aria-label="Юридические документы"><ul class="legal-documents">{% for doc in docs %}<li><a href="/legal/{{ doc.slug }}">{{ doc.title }}</a><span>Версия {{ doc.number }}</span></li>{% endfor %}</ul></nav>{% else %}<p>Документы пока не опубликованы. Обратитесь к владельцу сервиса.</p>{% endif %}{% endblock %}
